[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "absa"
version = "0.1.0"
description = "Aspect-based sentiment analysis of product reviews on SemEval-2014 Task 4"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are listed in requirements.txt to keep a single source of truth.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config --cov=absa --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PT", "RUF",
  "S", "T20", "PL", "ERA", "PERF", "PIE", "RET", "TID", "ARG", "PTH", "ISC",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"scripts/*" = ["T201", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["nbformat.*"]
ignore_missing_imports = true

[tool.codespell]
skip = "./.git,./.venv"
