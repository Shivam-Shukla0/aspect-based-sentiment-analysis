name: Issue checks

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  issue-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate title and required sections
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m scripts.checks issue
